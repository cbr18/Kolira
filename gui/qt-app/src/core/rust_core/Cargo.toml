[package]
name = "kolira_core"
version = "0.7.0"
edition = "2021"
description = "Kolira - Rust core and CLI for KDE appearance"
license = "MIT"
repository = "https://github.com/cbr18/Kolira"

[lib]
name = "kolira_core"
crate-type = ["rlib"]

# The command line interface is implemented in this crate so the library and
# the CLI share one source of truth (registry, mutations, status parsers).
# files/bin/* (bash) was removed in 0.5.0.
[[bin]]
name = "kolira"
path = "src/bin/kolira.rs"

[[bin]]
name = "theme-menu"
path = "src/bin/theme-menu.rs"

[[bin]]
name = "wallpaper-picker"
path = "src/bin/wallpaper-picker.rs"

[[bin]]
name = "wallpaper-next"
path = "src/bin/wallpaper-next.rs"

[[bin]]
name = "wallpaper-prev"
path = "src/bin/wallpaper-prev.rs"

[dependencies]
# Config parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = { version = "0.8", features = ["preserve_order"] }
configparser = "3.3"

# File system
dirs = "5.0"

# Process execution
which = "6.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
toml_edit = "0.22"
ureq = "2.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
flate2 = "1"
tar = { version = "0.4", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
tempfile = "3"



[profile.release]
lto = true
strip = true
codegen-units = 1
