name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Rust core + CLI ────────────────────────────────
  rust:
    name: Rust (core + CLI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui/qt-app/src/core/rust_core
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/qt-app/src/core/rust_core
      - name: Build
        run: cargo build --release
      - name: Unit tests
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Installer and CLI regressions
        working-directory: .
        run: bash tests/test-scripts.sh
      - name: Shell static analysis
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh tests/test-scripts.sh

  # ── Python GUI tests — required offscreen checks ─────────────────────────
  python-gui:
    name: Python GUI (PySide6) tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui/qt-app
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Build the CLI so parity/wallpaper tests actually run (they skip
      # when the artifacts are missing).
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build the Rust core + CLI
        working-directory: gui/qt-app/src/core/rust_core
        run: cargo build --release
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      # pytest-qt imports PySide6.QtGui/QtQuick at configure time; headless
      # runners need the Qt base libraries (verified on ubuntu 26.04).
      - name: Install Qt runtime libraries (headless PySide6)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libx11-6 libxcb1 libglib2.0-0 libgssapi-krb5-2 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export PATH="$(pwd)/src/core/rust_core/target/release:$PATH"
          python -m pytest tests/ -q

  # ── Security scan (deps + secrets) — informational, never blocks ──────────
  security:
    name: Security (trivy)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          exit-code: "0"