[mgr]
cwd = { fg = "#55d6d0" }
find_keyword = { fg = "#e7c77d", bold = true }
marker_copied = { fg = "#70b237" }
marker_cut = { fg = "#f06f65" }
marker_marked = { fg = "#55D6D0", bg = "#55D6D0" }
marker_selected = { fg = "#a98558" }
border_symbol = "│"
border_style = { fg = "#747474" }
hovered = { fg = "#cccccc", bg = "#404040" }
preview_hovered = { underline = true }

[tabs]
active = { fg = "#000000", bg = "#70B237", bold = true }
inactive = { fg = "#CCCCCC", bg = "#383838" }

[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
overall = { fg = "#cccccc", bg = "#383838" }

[filetype]
rules = [
  { url = "*/", fg = "#93CE4F" },
  { mime = "image/*", fg = "#F6C453" },
  { mime = "audio/*", fg = "#55D6D0" },
  { mime = "video/*", fg = "#A98558" },
  { url = "*", fg = "#CCCCCC" },
]

[indicator]
current = { fg = "#000000", bg = "#70B237" }
preview = { underline = true }

[mode]
normal_main = { fg = "#252525", bg = "#55d6d0", bold = true }
normal_alt = { fg = "#cccccc", bg = "#404040" }
select_main = { fg = "#252525", bg = "#a98558" }

[input]
border = { fg = "#55d6d0" }
value = { fg = "#cccccc" }
